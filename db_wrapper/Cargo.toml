[package]
name = "db_wrapper"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
db = { path = "../db" }
rusqlite = { version = "0.40.2", features = ["bundled-full"] }  # add bundled for wasm/native consistency
sqlite-wasm-rs = { version = "0.5", optional = true }
sqlite-wasm-vfs = { version = "0.2", optional = true }

[features]
default = ["android"]
android = []
web = ["sqlite-wasm-rs", "sqlite-wasm-vfs"]

[lib]
crate-type = ["cdylib", "rlib"]
