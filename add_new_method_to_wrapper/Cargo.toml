[workspace]
members = ["app", "every_page_ever", "app_core"]
resolver = "2"
default-members = ["app", "app_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = "0.36.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
